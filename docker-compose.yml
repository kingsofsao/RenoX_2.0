# Production stack: Caddy (HTTPS) -> web (nginx + React) -> backend (FastAPI) -> FalkorDB.
# Only Caddy is published (ports 80 and 443). The web server, the API and the database are reachable
# on the internal network only.
#
#   cp .env.example .env                        # DOMAIN, ACME_EMAIL, FALKORDB_PASSWORD, operator details
#   cp backend/.env.example backend/.env        # then edit it (see the README "Deployment" section)
#   docker compose up -d --build
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    networks: [internal]

  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    environment:
      # Password-protected, append-only persistence. Never publish this port.
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD} --appendonly yes"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: production
      ALLOWED_ORIGINS: https://${DOMAIN}
      FALKORDB_URL: falkor://default:${FALKORDB_PASSWORD}@falkordb:6379
      RESEARCHMIND_DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on: [falkordb]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: https://${DOMAIN}
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    restart: unless-stopped
    depends_on: [backend]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  caddy-data:
  caddy-config:
  falkordb-data:
  app-data:

networks:
  internal:
