# Production web server for the built React app. The API is reached on the same origin (/api),
# so session cookies stay first-party and no CORS is needed. TLS is terminated in front of this
# container (the Caddy service in docker-compose.yml, or a load balancer), which forwards X-Forwarded-Proto.
# The scheme the visitor used: from the TLS terminator in front, or this server's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: up to MAX_FILES_PER_UPLOAD x MAX_UPLOAD_MB (default 10 x 25 MB) plus form overhead.
    client_max_body_size 260m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Behind the TLS proxy (Caddy on the private Docker network), take the visitor's address from
    # X-Forwarded-For. Only proxies on private networks are trusted, so a client on the internet
    # cannot spoof its address to dodge the API's rate limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Unknown paths get the app shell (which renders the "page not found" screen) with a real 404 status,
    # so search engines do not index broken links.
    error_page 404 /index.html;

    # --- API: proxied to the backend, which sets its own (stricter) headers -----------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) the client address, so it cannot be spoofed to dodge rate limits.
        # Behind another proxy, add `set_real_ip_from <proxy ip>; real_ip_header X-Forwarded-For;`.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;     # long uploads and investigations with wait=true
        proxy_send_timeout 600s;
        proxy_request_buffering off;  # stream uploads; the API enforces the size limits
        proxy_hide_header Server;
        proxy_intercept_errors off;   # API errors stay JSON
    }

    # Fingerprinted build assets never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Product screenshots, icons and the social preview image: cache for a week.
    location ~* ^/(images/.+\.webp|og-image\.png|favicon\.(ico|svg)|apple-touch-icon\.png|icon-[a-z0-9-]+\.png)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve hidden files, source maps or backups.
    location ~ /\. { return 404; }
    location ~* \.(map|bak|orig|swp)$ { return 404; }

    # Routes of the single-page app: always the app shell, always revalidated.
    location ~ ^/(signin|signup|privacy|terms|investigate|library|upload|projects|settings|admin|graph)/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ~ ^/papers/[A-Za-z0-9_-]+/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # The home page, robots.txt, sitemap.xml, the manifest and other files in the build root.
    # Anything else is a 404 (served as the app shell above).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
}
