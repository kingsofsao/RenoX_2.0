# Production web server for the built React app. The API is reached on the same origin (/api),
# so session cookies stay first-party and no CORS is needed. Terminate TLS in front of this
# container (load balancer, Caddy, or nginx with certbot) and forward X-Forwarded-Proto.
# The scheme the visitor used: from the TLS terminator in front, or this server's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: up to MAX_FILES_PER_UPLOAD x MAX_UPLOAD_MB (default 10 x 25 MB) plus form overhead.
    client_max_body_size 260m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- security headers for the app shell -------------------------------------------------
    # No inline scripts anywhere (the theme is applied by /theme-init.js), no third-party origins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- API: proxied to the backend, which sets its own (stricter) headers -----------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) the client address, so it cannot be spoofed to dodge rate limits.
        # Behind another proxy, add `set_real_ip_from <proxy ip>; real_ip_header X-Forwarded-For;`.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;     # long uploads and investigations with wait=true
        proxy_send_timeout 600s;
        proxy_request_buffering off;  # stream uploads; the API enforces the size limits
        proxy_hide_header Server;
    }

    # Fingerprinted build assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never serve hidden files, source maps or backups.
    location ~ /\. { deny all; return 404; }
    location ~* \.(map|bak|orig|swp)$ { deny all; return 404; }

    # Single-page app: every other path is the app shell, which must always be revalidated.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
